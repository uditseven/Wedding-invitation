<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Udit weds Jagriti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/invite.css">
<script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body>
<button id="simple-mode-toggle" class="accessibility-fab" hidden>
<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
<path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
</svg>
</button>
<button id="audio-control" class="audio-fab" hidden>
<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
<path d="M8 5v14l11-7z"/>
<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
</svg>
</button>
<main id="app" aria-live="polite">
<!-- Added direct inline background/hero image support as a fallback incase JS misses it -->
<section class="hero" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://lh3.googleusercontent.com/pw/AP1GczOAWBFfxhI5ZioQdjKh11fwCFwt6eCjBoe6hKXhKjaqvVsNZxgDl8r1_es1qrzLe9jYMOQqh9lHofszfdSX-VbJjhmrUbJwL6XWb4POYJxEwrS2r9YVzAUByAiY9Q6UHiXLFDE8EkXJOMulw-sWg1JY=w651-h869-s-no-gm?authuser=0'); background-size: cover; background-position: center;">
<h1 id="event-title">Loading…</h1>
<p class="subtitle" id="event-subtitle"></p>
<div class="hero-meta">
<div id="countdown" class="countdown" hidden>
<span class="countdown-label">Event starts in</span>
<div class="countdown-grid">
<div class="countdown-unit"><strong id="cd-days">0</strong><span>Days</span></div>
<div class="countdown-unit"><strong id="cd-hours">00</strong><span>Hours</span></div>
<div class="countdown-unit"><strong id="cd-minutes">00</strong><span>Minutes</span></div>
<div class="countdown-unit"><strong id="cd-seconds">00</strong><span>Seconds</span></div>
</div></div>
<div id="calendar-actions" hidden>
<a id="google-calendar-link" target="_blank" rel="noopener">Add to Google Calendar</a>
</div></div>
</section>
<section class="section event-details" style="background-image: url('https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.vecteezy.com%2Fsystem%2Fresources%2Fthumbnails%2F053%2F808%2F762%2Fsmall_2x%2Fwedding-party-decoration-scene-background-free-photo.jpeg&f=1&nofb=1&ipt=af392c7a7c1d3515ae11ce9705286aee834e87c7aac963eb4d28ae5f3bf3dd2b&ipo=images'); background-size: cover; background-blend-mode: overlay;">
<h2>Event Details</h2>
<div class="event-datetime">
<div><strong>Date:</strong> <time id="event-date"></time></div>
<div><strong>Time:</strong> <span id="event-time"></span></div>
</div>
<p id="event-description"></p>
<address class="location">
<p id="venue-name"></p>
<p id="venue-address"></p>
<a id="maps-link" target="_blank" rel="noopener">Open in Google Maps</a>
</address>
</section>
<section class="section" id="schedule-section" hidden>
<h2>Schedule</h2><ul id="schedule-list"></ul>
</section>
<section class="section" id="quotes-section" hidden>
<h2>Words of Inspiration</h2>
<div class="quotes-container" id="quotes-container"></div>
</section>
<footer>
<div class="footer-branding">
<!-- Removed the empty logo container causing the broken circular icon -->
<div class="footer-info">
<p class="hosted-by" id="footer-credits-label"></p>
<p class="copyright">
<span id="footer-copyright"></span>
<!-- Cleaned up template container to prevent stray pipes if empty -->
<span id="footer-template-container" hidden><span id="footer-template-label"></span> <a id="footer-template-link" href="#"></a></span>
</p>
<p id="footer-repo-container" class="repo-info" hidden>
<a id="footer-repo-link" href="#"></a>
</p>
    <div class="social-links" id="social-links" hidden>
        <a id="instagram-link" class="social-link" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
            </svg>
        </a>
    </div>
<span id="instagram-label">Follow on Instagram</span>
</div>
</div>
<p id="footer-text"></p>
</footer>
</main>
<script src="js/invite.js"></script>
</body>
</html>
